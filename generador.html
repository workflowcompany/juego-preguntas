<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Generador de links — Mística</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:#0a0618;--surface:#15102a;--raised:#1f1738;--text:#f5f0ff;--sub:rgba(230,220,255,.88);--border:rgba(180,140,255,.22);--gold:#d4af37;--glow:rgba(180,120,255,.35);--p1:#9b7fd4;--font-body:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--font-display:"Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:17px}
body{font-family:var(--font-body);background:radial-gradient(900px 500px at 15% 10%,rgba(147,51,234,.18) 0%,transparent 55%),var(--bg);color:var(--text);min-height:100svh;padding:20px 16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-height:calc(100svh - 40px);justify-content:center}
h1{font-family:var(--font-display);font-size:1.65rem;letter-spacing:.02em;text-align:center;font-weight:700;background:linear-gradient(135deg,var(--gold),#e8d5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.25}
p.sub{text-align:center;color:var(--sub);font-size:1.05rem;line-height:1.55}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 0 24px rgba(147,51,234,.12)}
label{font-family:var(--font-display);font-size:0.82rem;font-weight:600;letter-spacing:.02em;color:var(--sub)}
input{width:100%;min-height:52px;border-radius:14px;border:1px solid var(--border);background:rgba(10,6,24,.6);color:#fff;font-size:1.05rem;padding:0 16px;font-family:var(--font-body)}
input:focus{outline:2px solid var(--gold);box-shadow:0 0 16px var(--glow)}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:14px;border:none;font-family:var(--font-display);font-size:1rem;font-weight:600;letter-spacing:.01em;cursor:pointer}
.btn-main{color:#1a0f2e;background:linear-gradient(135deg,var(--gold),#9333ea);box-shadow:0 0 20px var(--glow)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--sub)}
.err{color:#ffb1a8;font-size:0.95rem;text-align:center;line-height:1.45}
.out{background:var(--raised);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:0.88rem;word-break:break-all;color:var(--sub);line-height:1.5}
.ok{color:#8fe0b0;font-size:0.95rem;text-align:center;line-height:1.45}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="invite-crypto.js"></script>
<script>
"use strict";
const PIN="3847";
const HOST="Sebas";
const app=document.getElementById("app");
const enc=new TextEncoder();
let PIN_EXPECTED="";

async function pinHash(pin){
  const buf=await crypto.subtle.digest("SHA-256",enc.encode("mistica-pin:"+pin));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function renderPin(){
  app.innerHTML=`<h1>🔐 Generador</h1>
  <p class="sub">Solo para ti. Crea links personalizados para Mística.</p>
  <div class="card">
    <label for="pin">PIN de acceso</label>
    <input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="••••" autocomplete="off"/>
    <p class="err hidden" id="pin-err">PIN incorrecto</p>
    <button class="btn btn-main" id="btn-pin">Entrar</button>
  </div>`;
  document.getElementById("btn-pin").onclick=checkPin;
  document.getElementById("pin").addEventListener("keydown",e=>{if(e.key==="Enter")checkPin()});
}

async function checkPin(){
  const v=document.getElementById("pin").value.trim();
  const h=await pinHash(v);
  if(h!==PIN_EXPECTED){
    document.getElementById("pin-err").classList.remove("hidden");
    return;
  }
  sessionStorage.setItem("mistica-gen-ok","1");
  renderGen();
}

function renderGen(){
  app.innerHTML=`<h1>✨ Nuevo link</h1>
  <p class="sub">El juego mostrará <strong style="color:var(--text)">{nombre} y ${esc(HOST)}</strong></p>
  <div class="card">
    <label for="name">Nombre de tu acompañante</label>
    <input id="name" maxlength="24" placeholder="Ej. Juana" autocomplete="off"/>
    <button class="btn btn-main" id="btn-gen">Generar link</button>
    <p class="err hidden" id="gen-err"></p>
    <div class="out hidden" id="out"></div>
    <button class="btn btn-ghost hidden" id="btn-copy">Copiar link</button>
    <p class="ok hidden" id="copied">¡Copiado!</p>
  </div>`;
  document.getElementById("btn-gen").onclick=generate;
  document.getElementById("btn-copy").onclick=copyLink;
  document.getElementById("name").addEventListener("keydown",e=>{if(e.key==="Enter")generate()});
}

let lastLink="";
async function generate(){
  const name=document.getElementById("name").value.trim();
  const err=document.getElementById("gen-err");
  err.classList.add("hidden");
  if(!name){err.textContent="Escribe un nombre";err.classList.remove("hidden");return}
  try{
    const token=await INVITE.encryptName(name);
    lastLink=INVITE.gameUrl(token);
    document.getElementById("out").textContent=lastLink;
    document.getElementById("out").classList.remove("hidden");
    document.getElementById("btn-copy").classList.remove("hidden");
    document.getElementById("copied").classList.add("hidden");
  }catch(e){
    err.textContent="No se pudo generar el link";err.classList.remove("hidden");
  }
}

async function copyLink(){
  if(!lastLink)return;
  try{await navigator.clipboard.writeText(lastLink)}catch(_){
    const ta=document.createElement("textarea");ta.value=lastLink;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();
  }
  document.getElementById("copied").classList.remove("hidden");
}

async function init(){
  PIN_EXPECTED=await pinHash(PIN);
  if(sessionStorage.getItem("mistica-gen-ok")==="1") renderGen();
  else renderPin();
}
init();
</script>
</body>
</html>
