<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mística — Juego de preguntas</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0a0618; --surface:#15102a; --raised:#1f1738;
  --text:#f5f0ff; --sub:rgba(220,205,255,.72); --border:rgba(180,140,255,.22);
  --gold:#d4af37; --gold-dim:#a8882a; --glow:rgba(180,120,255,.35);
  --l1a:#7dd3b0; --l1b:#3d9a8b; --l2a:#e8c547; --l2b:#c97b2e; --l3a:#e879a9; --l3b:#9333ea;
  --p1:#9b7fd4; --p2:#d4a574;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  background:
    radial-gradient(900px 500px at 15% 10%, rgba(147,51,234,.18) 0%, transparent 55%),
    radial-gradient(700px 450px at 85% 20%, rgba(212,175,55,.1) 0%, transparent 50%),
    radial-gradient(600px 400px at 50% 100%, rgba(88,28,135,.25) 0%, transparent 60%),
    var(--bg);
  color:var(--text); min-height:100svh; -webkit-font-smoothing:antialiased;
  position:relative;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,.55) 0%, transparent 100%),
    radial-gradient(1px 1px at 25% 40%, rgba(255,255,255,.35) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 45% 8%, rgba(255,255,255,.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 60% 55%, rgba(255,255,255,.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 78% 22%, rgba(255,255,255,.45) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 88% 70%, rgba(255,255,255,.35) 0%, transparent 100%),
    radial-gradient(1px 1px at 35% 82%, rgba(255,255,255,.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 92% 38%, rgba(255,255,255,.5) 0%, transparent 100%);
  opacity:.85;
}
#app{max-width:480px;margin:0 auto;min-height:100svh;display:flex;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom));position:relative;z-index:1}
.screen{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* header */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0 12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--raised);border:1px solid var(--border);color:var(--text);white-space:nowrap}
.chip.turn1{background:rgba(155,127,212,.2);border-color:rgba(155,127,212,.55)}
.chip.turn2{background:rgba(212,165,116,.18);border-color:rgba(212,165,116,.5)}
.linkbtn{background:none;border:none;color:var(--sub);font-size:13px;font-weight:600;cursor:pointer;padding:8px 4px;min-height:44px}
.linkbtn:hover{color:#fff}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:16px;
  border:1px solid var(--border);background:var(--raised);color:#fff;font-size:16px;font-weight:700;cursor:pointer;
  transition:transform .08s ease, filter .15s ease;font-family:"Cinzel",serif;letter-spacing:.03em}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.1)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn-grad{border:none;color:#1a0f2e;background:linear-gradient(135deg,var(--ga,#d4af37),var(--gb,#9333ea));box-shadow:0 0 20px var(--glow)}
.btn-ghost{background:transparent}
.btn-danger{background:rgba(233,115,102,.14);border-color:rgba(233,115,102,.5);color:#ffb1a8}
.btn small{font-weight:600;opacity:.75}
.stack{display:flex;flex-direction:column;gap:12px}

/* setup */
.hero{text-align:center;display:flex;flex-direction:column;gap:10px}
.hero .logo{font-size:52px;line-height:1;filter:drop-shadow(0 0 12px var(--glow));animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.hero h1{font-family:"Cinzel",serif;font-size:34px;letter-spacing:.08em;font-weight:700;background:linear-gradient(135deg,var(--gold),#e8d5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{color:var(--sub);font-size:16px;line-height:1.55;max-width:38ch;margin:0 auto}
.warning{
  background:linear-gradient(135deg,rgba(147,51,234,.12),rgba(212,175,55,.08));
  border:1px solid rgba(212,175,55,.35);border-radius:16px;padding:16px 18px;
  text-align:left;display:flex;flex-direction:column;gap:10px;
  box-shadow:0 0 24px rgba(147,51,234,.15), inset 0 1px 0 rgba(255,255,255,.06);
}
.warning .warn-title{font-family:"Cinzel",serif;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--gold);display:flex;align-items:center;gap:8px}
.warning p{font-size:14.5px;line-height:1.55;color:var(--sub);margin:0}
.warning .cats{font-size:13.5px;line-height:1.65;color:rgba(220,205,255,.85)}
.warning .cats strong{color:var(--text);font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;text-align:left}
.field label{font-family:"Cinzel",serif;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--sub)}
.field input{min-height:52px;border-radius:14px;border:1px solid var(--border);background:rgba(10,6,24,.6);color:#fff;font-size:17px;padding:0 16px;font-family:inherit}
.field input:focus{outline:2px solid var(--gold);border-color:transparent;box-shadow:0 0 16px var(--glow)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* handoff */
.handoff{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.handoff .big{font-size:64px;animation:bounce 1.4s ease infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.handoff h2{font-family:"Cinzel",serif;font-size:24px;letter-spacing:.04em;line-height:1.35}
.handoff p{color:var(--sub);font-size:15px}
.banner{font-size:14px;font-weight:700;padding:10px 16px;border-radius:12px;display:inline-flex;gap:8px;align-items:center}
.banner.gain{background:rgba(114,188,143,.15);color:#8fe0b0;border:1px solid rgba(114,188,143,.4)}
.banner.loss{background:rgba(233,115,102,.14);color:#ffb1a8;border:1px solid rgba(233,115,102,.4)}

/* question card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:26px 22px;
  box-shadow:0 0 30px rgba(147,51,234,.12), 0 14px 40px rgba(0,0,0,.4);
  animation:flip .5s cubic-bezier(.2,.7,.3,1);transform-style:preserve-3d;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,var(--ga),var(--gb))}
@keyframes flip{from{transform:rotateY(80deg);opacity:0}to{transform:rotateY(0);opacity:1}}
.card .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.lvlchip{font-size:12.5px;font-weight:800;padding:5px 11px;border-radius:999px;color:#180f2e;background:linear-gradient(135deg,var(--ga),var(--gb))}
.catchip{font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--raised);border:1px solid var(--border);color:var(--sub)}
.card .q{font-size:23px;font-weight:800;line-height:1.32;letter-spacing:-.015em;min-height:3.2em}
.card .vals{display:flex;gap:16px;margin-top:20px;font-size:14px;font-weight:700}
.card .vals .gain{color:#8fe0b0}.card .vals .loss{color:#ffb1a8}
.card .subtxt{color:var(--sub);font-size:15px;line-height:1.5;margin-top:8px}
.card .bigicon{font-size:44px;margin-bottom:10px}

/* overlay & modal */
.overlay{position:fixed;inset:0;background:rgba(10,7,24,.75);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;animation:fade .2s ease}
.sheet{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px}
.sheet h3{font-size:19px;text-align:center}
.scorerow{display:flex;align-items:center;justify-content:space-between;background:var(--raised);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.scorerow .nm{font-weight:800;font-size:16px}
.scorerow .meta{font-size:12.5px;color:var(--sub);margin-top:2px}
.scorerow .pts{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.center{text-align:center;color:var(--sub);font-size:13.5px}

/* end screen */
.end{display:flex;flex-direction:column;gap:18px;text-align:center;padding:8px 0}
.end .crown{font-size:56px}
.end h2{font-family:"Cinzel",serif;font-size:26px;letter-spacing:.04em}
.end .sub{color:var(--sub);font-size:15px}
.statcard{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:10px}
.statcard .head{display:flex;justify-content:space-between;align-items:baseline}
.statcard .head .nm{font-weight:800;font-size:17px}
.statcard .head .pts{font-size:24px;font-weight:900}
.statcard .line{font-size:13.5px;color:var(--sub)}
.lvlrow{display:flex;gap:8px;flex-wrap:wrap}
.lvltag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:var(--raised);color:var(--sub)}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>

const CFG={
  perPlayer:35,
  levelDistribution:[0.40,0.35,0.25],
  maxSameCategory:3,
  comicReliefAfter:2,
  minDivertidas:2,
  nosotrosFrom:5,
  sensitiveDefault:false,
  historyTtlDays:90
};
const SESSION_LEN=CFG.perPlayer*2;
const PTS={1:[5,-2],2:[10,-5],3:[20,-10]};
const LVL={1:{name:"I · Susurro",ga:"var(--l1a)",gb:"var(--l1b)"},2:{name:"II · Confesión",ga:"var(--l2a)",gb:"var(--l2b)"},3:{name:"III · Revelación",ga:"var(--l3a)",gb:"var(--l3b)"}};
const CATEMOJI={"Infancia y raíces":"🌱","Relaciones":"💞","Trabajo y ambición":"💼","Miedos e inseguridades":"🌑","Valores y creencias":"🧭","Divertidas":"🎉","Futuro":"🔮","Arrepentimientos":"🕯️"};
const KEY="juego-mistica-v2";
const HIST_KEY="juego-mistica-pairs";
const QIDX={};QUESTIONS.forEach((q,i)=>QIDX[q[0]]=i);
const CLOSING_CATS=new Set(["Divertidas","Relaciones","Valores y creencias","Futuro"]);
const HEAVY_CLOSING_CATS=new Set(["Arrepentimientos","Miedos e inseguridades"]);

function qLvl(q){return q[1]}
function qCat(q){return q[2]}
function qText(q){return q[3]}
function qNotes(q){return q[4]||""}
function isPicante(q){return /picante/i.test(qNotes(q))}
function isSensible(q){return /sensible/i.test(qNotes(q))}
function isNosotros(q){
  const n=qNotes(q).toLowerCase(), t=qText(q).toLowerCase();
  if(/nosotros|aquí-y-ahora|aquí y ahora/.test(n))return true;
  return /\bde mí\b|\bconmigo\b|\bnos escap|\besta conversación\b|\btenemos en común\b/.test(t);
}
function isPositiveClose(q){
  if(qLvl(q)>2)return false;
  if(HEAVY_CLOSING_CATS.has(qCat(q)))return false;
  if(isSensible(q))return false;
  return CLOSING_CATS.has(qCat(q))||/positiv|risa|gratitud|mejor.*conversación|día perfecto|reír/i.test(qNotes(q)+qText(q));
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function clearSave(){try{localStorage.removeItem(KEY)}catch(e){}}
function pairKey(){const n=S.players.map(p=>p.name.trim().toLowerCase()).sort();return n.join("|")}
function loadPairHist(){try{const all=JSON.parse(localStorage.getItem(HIST_KEY)||"{}");const e=all[pairKey()];if(!e)return new Set();if(Date.now()-e.t>CFG.historyTtlDays*864e5)return new Set();return new Set(e.codes||[])}catch(e){return new Set()}}
function savePairHist(codes){try{const all=JSON.parse(localStorage.getItem(HIST_KEY)||"{}");all[pairKey()]={t:Date.now(),codes:[...codes]};localStorage.setItem(HIST_KEY,JSON.stringify(all))}catch(e){}}

function newState(){return{phase:"setup",sub:"choice",round:1,turn:0,queue:[],qIdx:0,cur:null,last:null,
  spicyGateDone:false,spicyVotes:[null,null],spicy:false,sensitive:CFG.sensitiveDefault,
  consecSkipsL3:0,consecL3:0,catCounts:{},divertidas:0,plan:[],comicSlots:new Set(),
  players:[mkPlayer(""),mkPlayer("")]}};
function mkPlayer(name){return{name:name,score:0,ans:0,sk:0,lv:{1:[0,0],2:[0,0],3:[0,0]},cat:{}}}
let S=newState();let pendingResume=null;

function buildLevelPlan(len){
  const t=CFG.levelDistribution.map(p=>Math.round(len*p));
  while(t[0]+t[1]+t[2]>len)t[t.indexOf(Math.max(...t))]--;
  while(t[0]+t[1]+t[2]<len)t[t.indexOf(Math.min(...t))]++;
  t[0]=Math.max(t[0],2);
  const plan=[1,1]; const counts={1:2,2:0,3:0}; let last=1,consec3=0; const comic=new Set();
  for(let i=2;i<len;i++){
    const rem=len-i, need={1:t[0]-counts[1],2:t[1]-counts[2],3:t[2]-counts[3]};
    if(consec3>=CFG.comicReliefAfter && need[1]>0){
      plan.push(1);counts[1]++;comic.add(i);consec3=0;last=1;continue;
    }
    if(i===len-1){
      const pick=need[1]>0?1:need[2]>0?2:1;plan.push(pick);counts[pick]++;continue;
    }
    let opts=[];
    for(let l=1;l<=3;l++) if(need[l]>0 && l>=last-1) opts.push(l);
    if(!opts.length) for(let l=1;l<=3;l++) if(need[l]>0) opts.push(l);
    let chosen=opts.includes(last+1)&&last<3?last+1:opts.includes(last)?last:opts[opts.length-1];
    if(rem<=need[3]&&need[3]>0&&opts.includes(3)) chosen=3;
    if(rem<=need[2]+need[3]&&need[2]>0&&chosen<2&&opts.includes(2)) chosen=2;
    plan.push(chosen);counts[chosen]++;
    consec3=chosen===3?consec3+1:0;last=chosen;
  }
  S.plan=plan;S.comicSlots=comic;return plan;
}

function poolForSlot(slotIdx,targetLvl,opts={}){
  const used=new Set(S.queue.filter(x=>x!=null));
  const lastCat=slotIdx>0&&S.queue[slotIdx-1]!=null?qCat(QUESTIONS[S.queue[slotIdx-1]]):null;
  const pairHist=opts.pairHist||loadPairHist();
  const needComic=S.comicSlots.has(slotIdx);
  const needClose=slotIdx===SESSION_LEN-1;
  const nosotrosOk=slotIdx>=CFG.nosotrosFrom;
  const allowPicante=S.spicy===true;
  const allowSensitive=S.sensitive===true;

  function ok(i){
    const q=QUESTIONS[i];
    if(used.has(i))return false;
    if(qLvl(q)!==targetLvl)return false;
    if(isSensible(q)&&!allowSensitive)return false;
    if(isPicante(q)&&!allowPicante)return false;
    if(!nosotrosOk&&isNosotros(q))return false;
    if(lastCat&&qCat(q)===lastCat)return false;
    if((S.catCounts[qCat(q)]||0)>=CFG.maxSameCategory)return false;
    if(pairHist.has(q[0]))return false;
    if(needComic&&qCat(q)!=="Divertidas")return false;
    if(needClose&&!isPositiveClose(q))return false;
    return true;
  }

  let pool=QUESTIONS.map((_,i)=>i).filter(ok);
  const relax=[
    ()=>pool=QUESTIONS.map((_,i)=>i).filter(i=>{const q=QUESTIONS[i];if(used.has(i)||qLvl(q)!==targetLvl)return false;if(isSensible(q)&&!allowSensitive)return false;if(isPicante(q)&&!allowPicante)return false;if(!nosotrosOk&&isNosotros(q))return false;if(needComic&&qCat(q)!=="Divertidas")return false;if(needClose&&!isPositiveClose(q))return false;return true}),
    ()=>pool=QUESTIONS.map((_,i)=>i).filter(i=>{const q=QUESTIONS[i];if(used.has(i)||qLvl(q)!==targetLvl)return false;if(isSensible(q)&&!allowSensitive)return false;if(isPicante(q)&&!allowPicante)return false;if(needComic&&qCat(q)!=="Divertidas")return false;if(needClose&&!isPositiveClose(q))return false;return true}),
    ()=>pool=QUESTIONS.map((_,i)=>i).filter(i=>{const q=QUESTIONS[i];if(used.has(i))return false;if(Math.abs(qLvl(q)-targetLvl)>1)return false;if(isSensible(q)&&!allowSensitive)return false;if(isPicante(q)&&!allowPicante)return false;return true}),
    ()=>pool=QUESTIONS.map((_,i)=>i).filter(i=>!used.has(i)&&(!isSensible(i)||allowSensitive)&&(!isPicante(QUESTIONS[i])||allowPicante)),
  ];
  for(const fn of relax){if(pool.length)break;fn()}
  return pool;
}

function weightedPick(pool){
  if(!pool.length)return null;
  const w=pool.map(()=>1);
  const tot=w.reduce((a,b)=>a+b,0); let r=Math.random()*tot;
  for(let j=0;j<pool.length;j++){if(r<w[j])return pool[j];r-=w[j]}
  return pool[pool.length-1];
}

function trackPick(idx){
  const cat=qCat(QUESTIONS[idx]);
  S.catCounts[cat]=(S.catCounts[cat]||0)+1;
  if(cat==="Divertidas") S.divertidas++;
}
function untrackPick(idx){
  if(idx==null)return;
  const cat=qCat(QUESTIONS[idx]);
  if(S.catCounts[cat]) S.catCounts[cat]--;
  if(cat==="Divertidas"&&S.divertidas>0) S.divertidas--;
}

function fillSlot(i){
  if(S.queue[i]!=null) return S.queue[i];
  let lvl=S.plan[i]; let idx=null;
  for(let attempt=0;attempt<8&&!idx;attempt++){
    const pool=poolForSlot(i,lvl,{pairHist:loadPairHist()});
    idx=weightedPick(pool);
    if(!idx&&attempt===3) lvl=Math.max(1,lvl-1);
    if(!idx&&attempt===5) lvl=Math.min(3,lvl+1);
  }
  if(idx==null) return null;
  S.queue[i]=idx; trackPick(idx); return idx;
}

function prepareSession(){
  S.queue=new Array(SESSION_LEN).fill(null);
  S.catCounts={}; S.divertidas=0;
  buildLevelPlan(SESSION_LEN);
  for(let i=0;i<Math.min(3,SESSION_LEN);i++){
    if(!fillSlot(i)) return false;
  }
  if(S.divertidas<1){
    const rep=poolForSlot(2,1,{pairHist:loadPairHist()}).filter(j=>qCat(QUESTIONS[j])==="Divertidas")[0];
    if(rep!=null){S.queue[2]=rep; S.catCounts["Divertidas"]=(S.catCounts["Divertidas"]||0)+1}
  }
  return true;
}

function replaceCurrentQuestion(){
  const slot=S.qIdx, lvl=qLvl(QUESTIONS[S.cur]);
  untrackPick(S.queue[slot]); S.queue[slot]=null;
  const pool=poolForSlot(slot,lvl,{pairHist:loadPairHist()});
  const idx=weightedPick(pool);
  if(idx==null)return false;
  S.queue[slot]=idx; trackPick(idx); S.cur=idx; return true;
}

function currentQuestionDone(){
  const c=QUESTIONS[S.cur][0];
  const hist=loadPairHist(); hist.add(c); savePairHist(hist);
}

function cardsPlayed(){return S.qIdx}
function cardsTotal(){return SESSION_LEN}
function playerQuestionsDone(){return Math.floor(S.qIdx/2)}
function needsSpicyGate(){
  if(S.spicyGateDone)return false;
  for(let i=S.qIdx;i<SESSION_LEN;i++) if(S.plan[i]===3) return true;
  return false;
}

  const q=QUESTIONS[S.cur],lvl=LVL[qLvl(q)],[win,lose]=PTS[qLvl(q)];
  const chips=`<div class="chips"><span class="lvlchip">${lvl.name}</span><span class="catchip">${CATEMOJI[qCat(q)]||""} ${esc(qCat(q))}</span></div>`;
  let body="";

    body=`<div class="card" style="--ga:${lvl.ga};--gb:${lvl.gb}">${chips}

    </div>
    <div class="stack">
      <button class="btn btn-grad" style="--ga:${lvl.ga};--gb:${lvl.gb}" id="btn-answer" onclick="G.answer()">Responder&nbsp;<small>+${win}</small></button>
      <button class="btn btn-danger" id="btn-skip" onclick="G.skip()">Paso&nbsp;<small>${lose}</small></button>
      <button class="btn btn-ghost" id="btn-points" onclick="G.points()">📊 Ver puntos</button>
    </div>`;
  }else if(S.sub==="answer"){
    body=`<div class="card" style="--ga:${lvl.ga};--gb:${lvl.gb}">${chips}
      <div class="bigicon">🗣️</div>
      <div class="q" style="font-size:20px">${esc(qText(q))}</div>
      <p class="subtxt">Respóndela en voz alta, sin afán. Cuando termines, confirma para ganar tus puntos.</p>
    </div>
    <div class="stack">
      <button class="btn btn-grad" style="--ga:${lvl.ga};--gb:${lvl.gb}" id="btn-confirm-answer" onclick="G.confirmAnswer()">Listo, respondida ✓&nbsp;<small>+${win}</small></button>
      <button class="btn btn-ghost" id="btn-back" onclick="G.back()">← Volver</button>
    </div>`;
  }else{
    body=`<div class="card" style="--ga:${lvl.ga};--gb:${lvl.gb}">${chips}
      <div class="bigicon">😬</div>
      <div class="q" style="font-size:20px">¿Seguro que pasas?</div>
      <p class="subtxt">Perderás ${Math.abs(lose)} puntos. Te repone otra carta del mismo nivel.</p>
    </div>
    <div class="stack">
      <button class="btn btn-danger" id="btn-confirm-skip" onclick="G.confirmSkip()">Sí, paso&nbsp;<small>${lose}</small></button>
      <button class="btn btn-ghost" id="btn-back" onclick="G.back()">← Volver</button>
    </div>`;
  }
  app.innerHTML=`${topbar()}<div class="screen" style="justify-content:flex-start;padding-top:8px">${body}</div>`;
}

function lvlTags(p){return [1,2,3].map(l=>`<span class="lvltag">${LVL[l].name.split(" · ")[1]} ${p.lv[l][0]}✓ ${p.lv[l][1]}✗</span>`).join("")}
function mostAvoided(p){let best=null,n=0;for(const c in p.cat){if(p.cat[c]>n){n=p.cat[c];best=c}}return best?`Evita hablar de: ${CATEMOJI[best]||""} ${best}`:"No evitó ninguna pregunta 💪"}

function renderEnd(auto){
  const [a,b]=S.players;
  let title,crown;
  if(a.score===b.score){title="¡Empate!";crown="🤝"}
  else{const w=a.score>b.score?a:b;title=`¡Gana ${esc(w.name)}!`;crown="👑"}
  const cards=S.players.map((p,i)=>`<div class="statcard">
      <div class="head"><span class="nm"><span class="dot" style="background:var(--p${i+1})"></span>${esc(p.name)}</span><span class="pts">${p.score} pts</span></div>
      <div class="line">Respondidas ${p.ans} · Evitadas ${p.sk}</div>
      <div class="lvlrow">${lvlTags(p)}</div>
      <div class="line">${mostAvoided(p)}</div>
    </div>`).join("");
  app.innerHTML=`<canvas class="confetti" id="cv"></canvas><div class="screen"><div class="end">
    <div class="crown">${crown}</div>
    <h2>${title}</h2>
    <p class="sub">${auto?"¡Completaron las 70 cartas! ":""}${S.qIdx} carta${S.qIdx!==1?"s":""} jugada${S.qIdx!==1?"s":""} · ${Math.max(1,S.round-(S.turn===0?1:0))} ronda${Math.max(1,S.round-(S.turn===0?1:0))!==1?"s":""}.</p>
    ${cards}
    <button class="btn btn-grad" style="--ga:var(--gold);--gb:#9333ea" id="btn-new" onclick="G.fresh()">Nueva partida 🔄</button>
  </div></div>`;
  confetti();
}

function showOverlay(html){const o=document.createElement("div");o.className="overlay";o.id="ovl";o.innerHTML=`<div class="sheet">${html}</div>`;document.body.appendChild(o)}
function closeOverlay(){const o=document.getElementById("ovl");if(o)o.remove()}
G.points=function(){
  const rows=S.players.map((p,i)=>`<div class="scorerow"><div><div class="nm"><span class="dot" style="background:var(--p${i+1})"></span>${esc(p.name)}</div><div class="meta">Respondidas ${p.ans} · Evitadas ${p.sk}</div></div><div class="pts">${p.score}</div></div>`).join("");
  showOverlay(`<h3>📊 Marcador — Ronda ${S.round}</h3>${rows}<button class="btn" id="btn-close-points" onclick="G.closePoints()">Seguir jugando</button>`);
};
G.closePoints=closeOverlay;
G.askEnd=function(){
  showOverlay(`<h3>¿Terminar la partida?</h3><p class="center">Verán el marcador final y las estadísticas.</p>
  <button class="btn btn-danger" id="btn-confirm-end" onclick="G.end()">Sí, terminar 🏁</button>
  <button class="btn btn-ghost" id="btn-cancel-end" onclick="G.closePoints()">Seguir jugando</button>`);
};
G.spicyVote=function(yes){
  S.spicyVotes[S.turn]=yes;
  if(S.turn===0){S.turn=1;save();renderSpicyGate()}
  else{save();renderSpicyGate()}
};

G.start=function(){
  const n1=document.getElementById("p1name").value.trim()||"Jugador 1";
  const n2=document.getElementById("p2name").value.trim()||"Jugador 2";
  S=newState();S.players[0].name=n1;S.players[1].name=n2;
  if(!prepareSession()){alert("No hay suficientes preguntas para armar la partida.");return}
  S.phase="handoff";S.last=null;save();renderHandoff();
};
G.ready=function(){
  if(needsSpicyGate()&&!S.spicyGateDone){S.phase="spicy-gate";S.turn=0;S.spicyVotes=[null,null];save();renderSpicyGate();return}
  if(S.qIdx>=SESSION_LEN){G.end(true);return}
  if(S.cur==null){S.cur=fillSlot(S.qIdx);if(S.cur==null){G.end(true);return}}
  S.phase="question";S.sub="choice";save();renderQuestion();
};
G.answer=function(){S.sub="answer";save();renderQuestion()};
G.skip=function(){S.sub="skip";save();renderQuestion()};
G.back=function(){S.sub="choice";save();renderQuestion()};
G.confirmAnswer=function(){
  const q=QUESTIONS[S.cur],p=S.players[S.turn],d=PTS[qLvl(q)][0],lv=qLvl(q);
  p.score+=d;p.ans++;p.lv[lv][0]++;
  S.consecSkipsL3=0; if(lv===3) S.consecL3++; else S.consecL3=0;
  currentQuestionDone(); S.last={d:d,name:p.name}; advance(true);
};
G.confirmSkip=function(){
  const q=QUESTIONS[S.cur],p=S.players[S.turn],d=PTS[qLvl(q)][1],lv=qLvl(q);
  p.score+=d;p.sk++;p.lv[lv][1]++;p.cat[qCat(q)]=(p.cat[qCat(q)]||0)+1;
  S.consecSkipsL3=lv===3?S.consecSkipsL3+1:0;
  if(lv===3) S.consecL3=0;
  if(!replaceCurrentQuestion()){
    currentQuestionDone(); S.last={d:d,name:p.name}; advance(true); return;
  }
  if(S.consecSkipsL3>=2 && S.plan[S.qIdx]===3){
    S.plan[S.qIdx]=2;
    const pool=poolForSlot(S.qIdx,2,{pairHist:loadPairHist()});
    const alt=weightedPick(pool);
    if(alt!=null){S.queue[S.qIdx]=alt;S.cur=alt}
  } else S.cur=S.queue[S.qIdx];
  S.last={d:d,name:p.name}; S.phase="question"; S.sub="choice"; save(); renderQuestion();
};
function advance(completed){
  if(completed){S.qIdx++;S.cur=null;S.sub="choice"}
  if(S.qIdx>=SESSION_LEN){G.end(true);return}
  if(S.turn===0){S.turn=1}else{S.turn=0;S.round++}
  S.phase="handoff";save();renderHandoff();
}
G.end=function(auto){closeOverlay();S.phase="end";save();renderEnd(auto===true)};
G.fresh=function(){clearSave();S=newState();renderSetup()};
G.resume=function(){
  S=pendingResume;pendingResume=null;
  if(!S.plan||!S.plan.length){if(!prepareSession()){renderSetup();return}}
  if(S.phase==="question")S.sub=S.sub||"choice";
  if(S.phase==="spicy-gate")renderSpicyGate();
  else if(S.phase==="handoff")renderHandoff();
  else if(S.phase==="question")renderQuestion();
  else renderSetup();
};

function confetti(){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cv=document.getElementById("cv");if(!cv)return;
  const ctx=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;
  const colors=["#d4af37","#9333ea","#9b7fd4","#e879a9","#7dd3b0","#e8c547"];
  const parts=Array.from({length:110},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,
    w:6+Math.random()*6,h:8+Math.random()*8,c:colors[Math.floor(Math.random()*colors.length)],
    vy:2+Math.random()*3,vx:-1+Math.random()*2,r:Math.random()*Math.PI,vr:-.1+Math.random()*.2}));
  let t=0;(function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});
    if(++t<260)requestAnimationFrame(tick);else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

(function(){
  const saved=load();
  if(saved&&(saved.phase==="handoff"||saved.phase==="question"||saved.phase==="spicy-gate")&&saved.players&&saved.players[0].name){
    pendingResume=saved;renderResume(saved);
  }else renderSetup();
})();

</script>
</body>
</html>
